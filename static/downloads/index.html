<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下載 Homelab 探針</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f19; color: #e8eefc; padding: 2rem; max-width: 640px; margin: auto; line-height: 1.5; }
    a { color: #00e676; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 1.25rem; margin: 1rem 0; }
    .btn { display: inline-block; background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.4); color: #00e676; padding: 0.75rem 1.1rem; border-radius: 10px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Homelab Windows 探針</h1>
  <div class="card">
    <p>在要被控的 Windows 電腦上下載並安裝，即可出現在網管的節點清單。</p>
    <p><a class="btn" href="/downloads/butler-node">下載安裝包（zip）</a></p>
    <ol>
      <li>解壓縮</li>
      <li>右鍵 <b>Install-All.cmd</b> → 以系統管理員身分執行</li>
      <li>回 Homelab → 節點管理 → 掃描區網</li>
    </ol>
  </div>
  <p><a href="/">← 回 Homelab 首頁</a></p>
</body>
</html>
