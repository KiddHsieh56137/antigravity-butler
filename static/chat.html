<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <title>AI 助理管家 · Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/static/i18n.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(14, 20, 32, 0.88);
      --panel-solid: #101826;
      --line: rgba(255,255,255,0.09);
      --line-strong: rgba(255,255,255,0.16);
      --text: #e8eef7;
      --muted: #8b95a8;
      --green: #00e676;
      --green-dim: rgba(0,230,118,0.12);
      --blue: #4fc3f7;
      --listen: #ffb74d;
      --danger: #ff8a80;
      --font: "Outfit", "Noto Sans TC", sans-serif;
      --side-w: 340px;
      --chat-max: 760px;
      --radius: 14px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body {
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(0,210,255,0.10), transparent 55%),
        radial-gradient(700px 380px at 92% 108%, rgba(0,230,118,0.07), transparent 55%),
        var(--bg);
      display: flex;
      flex-direction: column;
    }
    button, textarea, input { font: inherit; }
    :focus-visible {
      outline: 2px solid rgba(0,230,118,0.65);
      outline-offset: 2px;
    }

    .top {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      flex-shrink: 0;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
      background: linear-gradient(145deg, var(--green), #00b0ff);
      color: #0b0f19; font-size: 1.05rem;
      box-shadow: 0 0 0 3px rgba(0,230,118,0.12);
    }
    .title { font-weight: 700; font-size: 1rem; letter-spacing: 0.01em; white-space: nowrap; }
    .sub {
      font-size: 0.75rem; color: var(--green); margin-top: 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .sub::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; box-shadow: 0 0 8px currentColor;
    }
    .sub.listen { color: var(--listen); }
    .sub.speak { color: #80cbc4; }
    .sub.error { color: var(--danger); }
    .top-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .lang-toggle {
      display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    .lang-toggle button {
      border: 0; background: transparent; color: var(--muted);
      padding: 6px 9px; font-size: 0.72rem; cursor: pointer; font-weight: 600; font: inherit;
    }
    .lang-toggle button.active {
      background: rgba(0,230,118,0.12); color: var(--green);
    }
    .btn {
      border: 1px solid var(--line); background: rgba(255,255,255,0.035);
      color: var(--muted); border-radius: 10px; padding: 8px 11px;
      font-size: 0.8rem; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: color .15s, border-color .15s, background .15s, transform .12s;
    }
    .btn:hover { color: #fff; border-color: rgba(0,230,118,0.35); background: rgba(255,255,255,0.06); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--green-dim); color: var(--green); border-color: rgba(0,230,118,0.35); }
    .btn.ghost-icon { padding: 8px 10px; }
    .btn[aria-pressed="true"] {
      color: var(--green); border-color: rgba(0,230,118,0.45); background: var(--green-dim);
    }
    .btn-label { display: inline; }
    @media (max-width: 720px) {
      .btn-label { display: none; }
      .title { font-size: 0.92rem; }
    }

    .shell { flex: 1; min-height: 0; display: flex; position: relative; }
    .backdrop {
      display: none; position: absolute; inset: 0; z-index: 18;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
      border: 0; padding: 0; cursor: pointer;
    }
    .backdrop.show { display: block; animation: fadeIn .18s ease; }

    .history {
      width: var(--side-w); flex-shrink: 0;
      border-right: 1px solid var(--line);
      background: rgba(8,12,20,0.82);
      display: flex; flex-direction: column; min-height: 0;
      transition: width .22s ease, transform .22s ease;
    }
    .history.collapsed { width: 0; border: 0; overflow: hidden; }
    .history-head {
      padding: 14px 14px 10px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .history-head h2 { margin: 0; font-size: 0.9rem; font-weight: 600; flex: 1; }
    .history-tools { display: flex; gap: 6px; }
    .history-search { margin: 12px 12px 0; flex-shrink: 0; position: relative; }
    .history-search i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 0.78rem; pointer-events: none;
    }
    .history-search input {
      width: 100%; border-radius: 11px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.035); color: var(--text);
      padding: 10px 12px 10px 34px; font-size: 0.82rem; outline: none;
    }
    .history-search input:focus { border-color: rgba(0,230,118,0.4); }
    .history-list {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent;
    }
    .hist-item {
      text-align: left; border: 1px solid transparent; background: rgba(255,255,255,0.03);
      border-radius: 12px; padding: 11px 12px; cursor: pointer; color: inherit;
      transition: background .15s, border-color .15s, transform .12s;
    }
    .hist-item:hover { background: rgba(255,255,255,0.055); border-color: var(--line); }
    .hist-item.active {
      border-color: rgba(0,230,118,0.42); background: rgba(0,230,118,0.09);
      box-shadow: inset 3px 0 0 var(--green);
    }
    .hist-time { font-size: 0.68rem; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.02em; }
    .hist-user {
      font-size: 0.84rem; line-height: 1.4; font-weight: 500;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hist-assist {
      margin-top: 5px; font-size: 0.74rem; color: var(--muted); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hist-empty { color: var(--muted); font-size: 0.82rem; padding: 28px 10px; text-align: center; line-height: 1.55; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .log-wrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .log {
      flex: 1; overflow-y: auto; padding: 22px 18px 12px;
      display: flex; flex-direction: column; gap: 16px;
      width: min(100%, calc(var(--chat-max) + 48px));
      margin: 0 auto;
      scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent;
    }
    .row {
      display: flex; gap: 10px; align-items: flex-end;
      animation: msgIn .22s ease;
    }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }
    .bot-face {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 0.75rem; color: #0b0f19;
      background: linear-gradient(145deg, var(--green), #00b0ff);
      margin-bottom: 2px;
    }
    .bubble {
      max-width: min(640px, 86%);
      padding: 12px 15px; border-radius: 18px;
      line-height: 1.55; font-size: 0.94rem;
      white-space: pre-wrap; word-break: break-word;
    }
    .row.user .bubble {
      background: linear-gradient(160deg, rgba(0,230,118,0.18), rgba(0,176,255,0.08));
      border: 1px solid rgba(0,230,118,0.28);
      border-bottom-right-radius: 6px;
    }
    .row.bot .bubble {
      background: rgba(255,255,255,0.045);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
      white-space: normal;
    }
    .row.bot .bubble.md p { margin: 0 0 0.65em; }
    .row.bot .bubble.md p:last-child { margin-bottom: 0; }
    .row.bot .bubble.md ul, .row.bot .bubble.md ol { margin: 0.4em 0 0.6em 1.2em; }
    .row.bot .bubble.md a { color: var(--blue); }
    .row.bot .bubble.md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.88rem; }
    .row.bot .bubble.md th, .row.bot .bubble.md td {
      border: 1px solid var(--line); padding: 6px 8px; text-align: left;
    }
    .code-block { position: relative; margin: 10px 0; }
    .code-block pre {
      margin: 0; overflow-x: auto; border-radius: 10px;
      background: #0a0e16; border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 14px; white-space: pre; font-size: 0.84rem;
    }
    .code-copy-btn {
      position: absolute; top: 8px; right: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(17,25,40,0.92); color: var(--muted);
      border-radius: 8px; padding: 4px 10px; font-size: 0.72rem; cursor: pointer;
    }
    .code-copy-btn.copied, .code-copy-btn:hover { color: var(--green); border-color: rgba(0,230,118,0.45); }

    .typing-dots { display: inline-flex; gap: 5px; align-items: center; padding: 2px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }

    .empty {
      margin: auto; text-align: center; color: var(--muted);
      padding: 48px 20px; line-height: 1.65; max-width: 420px;
      animation: fadeIn .35s ease;
    }
    .empty h3 { margin: 0 0 8px; color: var(--text); font-size: 1.15rem; font-weight: 600; }
    .empty p { margin: 0 0 18px; font-size: 0.88rem; }
    .empty-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line); background: rgba(255,255,255,0.04);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      font-size: 0.8rem; cursor: pointer;
    }
    .chip:hover { border-color: rgba(0,230,118,0.4); color: var(--green); }

    .jump-bottom {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%) translateY(8px);
      opacity: 0; pointer-events: none;
      border: 1px solid var(--line-strong); background: var(--panel-solid);
      color: var(--text); border-radius: 999px; padding: 8px 14px;
      font-size: 0.78rem; cursor: pointer; z-index: 8;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: opacity .18s, transform .18s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .jump-bottom.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    .foot {
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(11,15,25,0.55), rgba(11,15,25,0.96));
      padding: 12px 14px calc(14px + var(--safe-b));
      flex-shrink: 0;
    }
    .composer {
      width: min(100%, calc(var(--chat-max) + 48px));
      margin: 0 auto;
      position: relative;
    }
    .composer-meta {
      display: flex; align-items: center; gap: 10px;
      min-height: 22px; margin: 0 4px 8px;
    }
    .composer-meta .pill {
      display: none; align-items: center; gap: 6px;
      border-radius: 999px; padding: 4px 10px;
      font-size: 0.72rem; border: 1px solid var(--line);
      background: rgba(255,255,255,0.03); color: var(--muted);
    }
    .composer-meta .pill.show { display: inline-flex; cursor: pointer; }
    .composer-meta .pill.show:hover { filter: brightness(1.12); }
    .composer-meta .pill .dot {
      width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    }
    .pill.ok { color: #b9f6ca; border-color: rgba(0,230,118,0.28); background: rgba(0,230,118,0.08); }
    .pill.warn { color: var(--listen); border-color: rgba(255,183,77,0.35); background: rgba(255,183,77,0.1); }
    .pill.warn .dot { animation: pulse 1s infinite; }
    .pill.bad { color: var(--danger); border-color: rgba(255,138,128,0.35); }
    .voice-interim {
      flex: 1; min-width: 0; color: var(--listen); font-size: 0.8rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      opacity: 0; transition: opacity .15s;
    }
    .voice-interim.show { opacity: 1; }
    .gear {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.03);
      color: var(--muted); cursor: pointer; flex-shrink: 0;
      display: grid; place-items: center;
    }
    .gear:hover, .gear[aria-expanded="true"] {
      color: var(--green); border-color: rgba(0,230,118,0.35);
    }
    .voice-sheet {
      display: none;
      position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
      z-index: 12;
      border: 1px solid var(--line);
      background: rgba(12, 18, 30, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .voice-sheet.show { display: block; animation: fadeIn .16s ease; }
    .voice-sheet h3 {
      margin: 0 0 10px; font-size: 0.82rem; font-weight: 600; color: var(--text);
    }
    .sheet-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    }
    @media (max-width: 560px) {
      .sheet-grid { grid-template-columns: 1fr; }
    }
    .mode-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .mode-pill {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 0.76rem; cursor: pointer;
    }
    .mode-pill.active {
      color: var(--green); border-color: rgba(0,230,118,0.4); background: rgba(0,230,118,0.1);
    }
    .v-btn {
      border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--text);
      border-radius: 10px; padding: 7px 11px; font-size: 0.78rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .v-btn:hover { border-color: rgba(0,230,118,0.35); }
    .v-select, .v-input {
      border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--text);
      border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; outline: none; width: 100%;
    }
    .voice-field { display: flex; flex-direction: column; gap: 5px; font-size: 0.72rem; color: var(--muted); }
    .voice-field.span2 { grid-column: 1 / -1; }
    .voice-field label.inline {
      display: inline-flex; align-items: center; gap: 8px; color: var(--text);
      font-size: 0.8rem; cursor: pointer; margin-top: 18px;
    }
    .voice-field label.inline input { accent-color: var(--green); }
    .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .sheet-hint { margin-top: 10px; color: var(--muted); font-size: 0.7rem; line-height: 1.45; }

    .foot-inner {
      display: flex; gap: 10px; align-items: flex-end;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.035);
      border-radius: 18px;
      padding: 8px;
      transition: border-color .15s, box-shadow .15s;
    }
    .foot-inner:focus-within {
      border-color: rgba(0,230,118,0.42);
      box-shadow: 0 0 0 3px rgba(0,230,118,0.08);
    }
    textarea {
      flex: 1; min-height: 44px; max-height: 160px; resize: none;
      border: 0; background: transparent; color: var(--text);
      padding: 10px 8px; font-size: 0.95rem; outline: none; line-height: 1.45;
    }
    .send, .mic {
      width: 44px; height: 44px; border: 0; border-radius: 50%;
      cursor: pointer; flex-shrink: 0; font-size: 1rem;
      transition: transform .12s, box-shadow .15s, background .15s, color .15s;
    }
    .send {
      background: var(--green); color: #0b0f19;
      box-shadow: 0 6px 18px rgba(0,230,118,0.22);
    }
    .send:hover { transform: translateY(-1px); }
    .mic {
      background: rgba(255,255,255,0.04);
      color: var(--text); border: 1px solid rgba(255,255,255,0.12);
    }
    .mic.on {
      color: var(--listen); border-color: rgba(255,183,77,0.55);
      background: rgba(255,183,77,0.12);
      box-shadow: 0 0 0 0 rgba(255,183,77,0.45);
      animation: micPulse 1.4s infinite;
    }
    .send:disabled, .mic:disabled { opacity: 0.45; cursor: wait; transform: none; }
    .top-menu { position: relative; }
    .top-menu-panel {
      display: none; position: absolute; right: 0; top: calc(100% + 8px);
      min-width: 160px; z-index: 40;
      background: rgba(12,18,30,0.98); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .top-menu-panel.show { display: grid; gap: 2px; }
    .top-menu-panel button, .top-menu-panel a {
      display: flex; align-items: center; gap: 8px;
      border: 0; background: transparent; color: var(--text);
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      text-decoration: none; font-size: 0.82rem; text-align: left;
    }
    .top-menu-panel button:hover, .top-menu-panel a:hover {
      background: rgba(255,255,255,0.06);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .45; }
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,183,77,0.4); }
      70% { box-shadow: 0 0 0 12px rgba(255,183,77,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,183,77,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important; transition: none !important; scroll-behavior: auto !important;
      }
    }

    @media (max-width: 900px) {
      .history {
        position: absolute; left: 0; top: 0; bottom: 0; z-index: 22;
        width: min(86vw, 340px); transform: translateX(0);
        box-shadow: 16px 0 48px rgba(0,0,0,0.45);
      }
      .history.collapsed { transform: translateX(-105%); width: min(86vw, 340px); border-right: 1px solid var(--line); overflow: hidden; pointer-events: none; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header class="top">
    <button type="button" class="btn ghost-icon" id="btn-hist" aria-controls="history" aria-expanded="true" data-i18n-title="chatpage.history">
      <i class="fa-solid fa-clock-rotate-left"></i><span class="btn-label" data-i18n="chatpage.histShort">歷史</span>
    </button>
    <div class="brand">
      <div class="avatar" aria-hidden="true"><i class="fa-solid fa-robot"></i></div>
      <div>
        <div class="title" data-i18n="chat.title">AI 助理管家</div>
        <div class="sub" id="status" data-i18n="chat.online">在線候命 (Gemini)</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="lang-toggle" role="group" data-i18n-title="chatpage.lang" title="語言">
        <button type="button" data-lang-btn="zh-TW" data-i18n="lang.zh">中</button>
        <button type="button" data-lang-btn="en" data-i18n="lang.en">EN</button>
      </div>
      <a class="btn" href="/?desktop=1" data-i18n-title="nav.dashboard"><i class="fa-solid fa-gauge-high"></i><span class="btn-label" data-i18n="nav.dashboard">儀表板</span></a>
      <div class="top-menu">
        <button type="button" class="btn ghost-icon" id="btn-top-more" title="更多" aria-expanded="false" aria-haspopup="true">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <div class="top-menu-panel" id="top-menu-panel">
          <button type="button" id="btn-clear"><i class="fa-solid fa-broom"></i><span data-i18n="chatpage.clear">清空畫面</span></button>
          <button type="button" id="btn-reset"><i class="fa-solid fa-rotate"></i><span data-i18n="chatpage.resetSession">重設 Session</span></button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <button type="button" class="backdrop" id="hist-backdrop" aria-label="關閉歷史面板"></button>
    <aside class="history" id="history" data-i18n-title="chatpage.history" aria-label="歷史對話">
      <div class="history-head">
        <h2 data-i18n="chatpage.history">歷史對話</h2>
        <div class="history-tools">
          <button type="button" class="btn ghost-icon" id="btn-new" data-i18n-title="chatpage.new"><i class="fa-solid fa-plus"></i></button>
          <button type="button" class="btn ghost-icon" id="btn-hist-refresh" data-i18n-title="fm.refresh"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
      <div class="history-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" id="hist-q" placeholder="搜尋歷史…" data-i18n-placeholder="chatpage.search" autocomplete="off" />
      </div>
      <div class="history-list" id="hist-list">
        <div class="hist-empty" data-i18n="common.loading">載入中…</div>
      </div>
    </aside>

    <div class="main">
      <div class="log-wrap">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions">
          <div class="empty" id="empty">
            <h3 data-i18n="chatpage.empty">開始對話吧</h3>
            <p data-i18n="chat.greeting">嗨，我是管家。直接打字或用語音即可。</p>
            <div class="empty-actions">
              <button type="button" class="chip" data-prompt="今天家裡有什麼狀況？">家裡狀況</button>
              <button type="button" class="chip" data-prompt="幫我查一下最近的對話重點">對話重點</button>
              <button type="button" class="chip" data-prompt="用輕鬆一點的語氣跟我聊天">輕鬆聊聊</button>
            </div>
          </div>
        </div>
        <button type="button" class="jump-bottom" id="jump-bottom" aria-label="跳到最新訊息">
          <i class="fa-solid fa-arrow-down"></i> 最新訊息
        </button>
      </div>

      <div class="foot">
        <div class="composer">
          <div class="voice-sheet" id="voice-more" role="dialog" aria-label="語音設定">
            <h3>語音與朗讀</h3>
            <div class="voice-field span2" style="margin-bottom:10px;">
              輸入模式
              <div class="mode-pills" id="mode-pills" role="group" aria-label="語音模式">
                <button type="button" class="mode-pill active" data-mode="tap" data-i18n="chat.modeTap">點擊</button>
                <button type="button" class="mode-pill" data-mode="ptt" data-i18n="chat.modePtt">長按PTT</button>
                <button type="button" class="mode-pill" data-mode="continuous" data-i18n="chat.modeCont">連續</button>
              </div>
            </div>
            <div class="sheet-grid">
              <div class="voice-field">
                聲線
                <select class="v-select" id="tts-voice"></select>
              </div>
              <div class="voice-field">
                語速品質
                <select class="v-select" id="tts-quality">
                  <option value="+0%">自然（推薦）</option>
                  <option value="+8%">稍快</option>
                  <option value="+15%">偏快</option>
                  <option value="-5%">偏慢清楚</option>
                </select>
              </div>
              <div class="voice-field">
                播放速度
                <select class="v-select" id="tts-play-rate" title="播放速度">
                  <option value="0.9">0.9x</option>
                  <option value="1" selected>1.0x</option>
                  <option value="1.15">1.15x</option>
                  <option value="1.3">1.3x</option>
                </select>
              </div>
              <div class="voice-field">
                喚醒詞
                <input class="v-input" type="text" id="wake-word" value="管家" maxlength="12" autocomplete="off" />
              </div>
              <div class="voice-field">
                <label class="inline"><input type="checkbox" id="tts-on" checked /> 回覆自動朗讀</label>
              </div>
            </div>
            <div class="sheet-actions">
              <button type="button" class="v-btn" id="btn-preview-tts"><i class="fa-solid fa-ear-listen"></i> 試聽</button>
              <button type="button" class="v-btn" id="btn-voice-reset"><i class="fa-solid fa-rotate-right"></i> 重置語音</button>
              <a class="v-btn" href="/voice" style="text-decoration:none;"><i class="fa-solid fa-mobile-screen"></i> 手機語音頁</a>
            </div>
            <div class="sheet-hint" id="voice-keys">點擊麥克風說一句；播報中再點可停止。Esc 也可停止。</div>
          </div>

          <div class="composer-meta">
            <span class="pill ok" id="voice-ready" title="點擊可停止"><span class="dot"></span><span id="voice-ready-text">語音就緒</span></span>
            <span class="voice-interim" id="voice-interim" aria-live="polite"></span>
            <button type="button" class="gear" id="btn-voice-more" title="語音設定" aria-expanded="false" aria-controls="voice-more">
              <i class="fa-solid fa-sliders"></i>
            </button>
          </div>

          <form class="foot-inner" id="form">
            <button class="mic" type="button" id="mic" title="點擊說話 · 再點停止 · Esc" aria-pressed="false">
              <i class="fa-solid fa-microphone" id="mic-icon"></i>
            </button>
            <textarea id="input" placeholder="對管家說話…" data-i18n-placeholder="chatpage.placeholder" rows="1" aria-label="訊息輸入"></textarea>
            <button class="send" type="submit" id="send" data-i18n-title="chatpage.send" title="送出"><i class="fa-solid fa-paper-plane"></i></button>
          </form>

  <script>
    const logEl = document.getElementById('log');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const histList = document.getElementById('hist-list');
    const historyEl = document.getElementById('history');
    const histBtn = document.getElementById('btn-hist');
    const histBackdrop = document.getElementById('hist-backdrop');
    const micBtn = document.getElementById('mic');
    const interimEl = document.getElementById('voice-interim');
    const ttsOnEl = document.getElementById('tts-on');
    const voiceReady = document.getElementById('voice-ready');
    const voiceReadyText = document.getElementById('voice-ready-text');
    const jumpBtn = document.getElementById('jump-bottom');
    let busy = false;
    let histItems = [];
    let audio = null;
    let audioUrl = null;
    let ttsGen = 0;
    let ttsBusy = false;
    let rec = null;
    let listening = false;
    let stickToBottom = true;
    let continuousArmed = false;
    let pttHolding = false;
    let inputMode = localStorage.getItem('aura_voice_mode') || 'tap';
    let commitTimer = null;
    let finalBuf = '';

    const voiceKeys = document.getElementById('voice-keys');
    const voiceMore = document.getElementById('voice-more');
    const wakeWordEl = document.getElementById('wake-word');
    const ttsVoiceEl = document.getElementById('tts-voice');
    const ttsQualityEl = document.getElementById('tts-quality');
    const ttsPlayRateEl = document.getElementById('tts-play-rate');
    const micIcon = document.getElementById('mic-icon');

    const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
    const isMobileHist = () => window.matchMedia('(max-width: 900px)').matches;
    const END_WORDS = /^(結束|停止|關掉|關閉語音|停止對話)$/;
    const tt = (key, vars) => (window.HomelabI18n ? HomelabI18n.t(key, vars) : key);

    function persistUiLocale(loc) {
      fetch('/api/system/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ui_locale: loc, rebuild_chat: true }),
      }).catch(() => {});
    }
    function setUiLocale(loc) {
      if (!window.HomelabI18n) return;
      HomelabI18n.setLocale(loc);
      persistUiLocale(loc);
      if (!busy && !listening && !ttsBusy) setStatus(tt('chat.online'));
      if (SR() && !listening && !ttsBusy) {
        setVoicePill('ok', continuousArmed ? '連續待命' : tt('chat.voiceReady'));
      }
    }
    function initI18n() {
      if (!window.HomelabI18n) return;
      HomelabI18n.initFromStorage();
      document.querySelectorAll('[data-lang-btn]').forEach((btn) => {
        btn.addEventListener('click', () => setUiLocale(btn.getAttribute('data-lang-btn')));
      });
      fetch('/api/system/settings')
        .then((r) => r.json())
        .then((j) => {
          if (j && j.ui_locale) HomelabI18n.setLocale(j.ui_locale);
        })
        .catch(() => {});
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'sub' + (cls ? ' ' + cls : '');
    }

    function setVoicePill(mode, text) {
      voiceReady.className = 'pill ' + mode;
      voiceReadyText.textContent = text;
      // Idle "ready" stays hidden; show only when listening / speaking / error
      const readyLabel = tt('chat.voiceReady');
      const idleReady = mode === 'ok' && (text === readyLabel || text === '語音就緒' || text === '● 語音就緒' || text === 'Voice ready');
      const show = mode === 'warn' || mode === 'bad' || (mode === 'ok' && !idleReady);
      voiceReady.classList.toggle('show', show || mode === 'bad');
    }

    function setInterim(text) {
      const t = String(text || '').trim();
      interimEl.textContent = t;
      interimEl.classList.toggle('show', !!t);
    }

    function updateMicIcon() {
      const active = listening || continuousArmed || ttsBusy || (audio && !audio.paused);
      if (micIcon) {
        micIcon.className = active ? 'fa-solid fa-stop' : 'fa-solid fa-microphone';
      }
      micBtn.classList.toggle('on', !!active);
      micBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
      if (ttsBusy) micBtn.title = '點擊停止播報';
      else if (inputMode === 'ptt') micBtn.title = active ? '點擊停止 / 長按說話' : '長按說話（PTT）';
      else if (inputMode === 'continuous') micBtn.title = continuousArmed ? '點擊結束連續對話' : '點擊開始連續對話';
      else micBtn.title = listening ? '點擊停止聆聽' : '點擊說話';
    }

    function syncModeUi() {
      document.querySelectorAll('.mode-pill').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === inputMode);
      });
      if (inputMode === 'ptt') {
        voiceKeys.textContent = '長按麥克風或空白鍵說話 · 放開送出 · Esc 停止';
      } else if (inputMode === 'continuous') {
        voiceKeys.textContent = continuousArmed
          ? '連續對話中 · 再說一次點麥克風結束，或說「結束」/ Esc'
          : '點麥克風開始連續聆聽 · Esc 停止';
      } else {
        voiceKeys.textContent = '點擊麥克風說一句 · 播報中再點可停止 · Esc';
      }
      updateMicIcon();
      try { localStorage.setItem('aura_voice_mode', inputMode); } catch (_) {}
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function renderMarkdown(text) {
      const raw = String(text || '');
      try {
        if (window.marked && window.DOMPurify) {
          marked.setOptions({ breaks: true, gfm: true });
          return DOMPurify.sanitize(marked.parse(raw), {
            USE_PROFILES: { html: true },
            ADD_ATTR: ['target', 'rel'],
          });
        }
      } catch (_) {}
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }
    function enhanceCodeBlocks(root) {
      if (!root) return;
      root.querySelectorAll('pre').forEach((pre) => {
        if (pre.parentElement && pre.parentElement.classList.contains('code-block')) return;
        const wrap = document.createElement('div');
        wrap.className = 'code-block';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-copy-btn';
        btn.textContent = '複製';
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(pre.innerText || '');
            btn.textContent = '已複製';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1400);
          } catch (_) { btn.textContent = '失敗'; }
        });
        wrap.appendChild(btn);
      });
    }

    function nearBottom() {
      return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
    }
    function updateJumpBtn() {
      jumpBtn.classList.toggle('show', !stickToBottom && logEl.scrollHeight > logEl.clientHeight + 40);
    }
    function scrollLogToBottom(force) {
      if (force || stickToBottom) {
        logEl.scrollTop = logEl.scrollHeight;
        stickToBottom = true;
        updateJumpBtn();
      }
    }
    logEl.addEventListener('scroll', () => {
      stickToBottom = nearBottom();
      updateJumpBtn();
    }, { passive: true });
    jumpBtn.addEventListener('click', () => scrollLogToBottom(true));

    function appendMsg(role, text) {
      const empty = document.getElementById('empty');
      if (empty) empty.remove();
      const row = document.createElement('div');
      row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
      if (role === 'bot') {
        const face = document.createElement('div');
        face.className = 'bot-face';
        face.innerHTML = '<i class="fa-solid fa-robot"></i>';
        face.setAttribute('aria-hidden', 'true');
        row.appendChild(face);
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (role === 'bot' ? ' md' : '');
      if (role === 'bot') {
        bubble.innerHTML = renderMarkdown(text);
        bubble.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
        enhanceCodeBlocks(bubble);
      } else {
        bubble.textContent = text;
      }
      row.appendChild(bubble);
      logEl.appendChild(row);
      scrollLogToBottom(false);
    }
    function appendTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typing';
      row.innerHTML = '<div class="bot-face" aria-hidden="true"><i class="fa-solid fa-robot"></i></div><div class="bubble"><div class="typing-dots" aria-label="思考中"><span></span><span></span><span></span></div></div>';
      logEl.appendChild(row);
      scrollLogToBottom(true);
      return row;
    }

    function stopTts() {
      ttsGen += 1;
      ttsBusy = false;
      stopTtsKeepGen();
      try { speechSynthesis.cancel(); } catch (_) {}
      updateMicIcon();
    }

    function stopTtsKeepGen() {
      try { if (audio) { audio.pause(); audio.removeAttribute('src'); audio.load(); } } catch (_) {}
      audio = null;
      if (audioUrl) {
        try { URL.revokeObjectURL(audioUrl); } catch (_) {}
        audioUrl = null;
      }
    }

    function selectedVoice() {
      return ttsVoiceEl.value || 'zh-TW-HsiaoYuNeural';
    }
    function selectedRate() {
      return ttsQualityEl.value || '+0%';
    }
    function playRate() {
      const n = parseFloat(ttsPlayRateEl.value || '1');
      return Number.isFinite(n) ? n : 1;
    }

    function prepareSpeakable(text) {
      let t = String(text || '');
      t = t.replace(/```[\s\S]*?```/g, ' ');
      t = t.replace(/`[^`]*`/g, ' ');
      t = t.replace(/[*_#>\[\]]/g, '');
      t = t.replace(/https?:\/\/\S+/g, '');
      t = t.replace(/\s+/g, ' ').trim();
      return t;
    }

    function splitSpeakChunks(text, maxChars) {
      const limit = maxChars || 140;
      const src = prepareSpeakable(text);
      if (!src) return [];
      if (src.length <= limit) return [src];
      const parts = src.split(/(?<=[。！？!?；;…]|\.(?=\s|$))\s*/);
      const chunks = [];
      let buf = '';
      for (const p of parts) {
        if (!p) continue;
        if ((buf + p).length > limit && buf) {
          chunks.push(buf);
          buf = p;
        } else {
          buf += p;
        }
      }
      if (buf) chunks.push(buf);
      // Cap total spoken length so very long replies don't queue forever
      let total = 0;
      const out = [];
      for (const c of chunks) {
        if (total >= 700) break;
        out.push(c);
        total += c.length;
      }
      return out.length ? out : [src.slice(0, limit)];
    }

    function playTtsBlob(blob, gen) {
      return new Promise((resolve) => {
        if (gen !== ttsGen) { resolve(false); return; }
        stopTtsKeepGen();
        if (!blob || blob.size < 64) { resolve(false); return; }
        const url = URL.createObjectURL(blob);
        audioUrl = url;
        const a = new Audio(url);
        audio = a;
        a.playbackRate = playRate();
        let done = false;
        const finish = (ok) => {
          if (done) return;
          done = true;
          resolve(!!ok);
        };
        const timer = setTimeout(() => {
          try { a.pause(); } catch (_) {}
          finish(false);
        }, 60000);
        a.onplaying = () => {
          setStatus('播報中…', 'speak');
          setVoicePill('ok', '播報中');
          updateMicIcon();
        };
        a.onended = () => { clearTimeout(timer); finish(true); };
        a.onerror = () => { clearTimeout(timer); finish(false); };
        const p = a.play();
        if (p && p.then) {
          p.then(() => {}).catch(() => { clearTimeout(timer); finish(false); });
        }
      });
    }

    async function fetchTtsBlob(text) {
      const params = new URLSearchParams({
        text,
        voice: selectedVoice(),
        rate: selectedRate(),
      });
      const resp = await fetch('/api/tts?' + params.toString());
      if (!resp.ok) throw new Error('TTS ' + resp.status);
      const blob = await resp.blob();
      if (!blob || blob.size < 64) throw new Error('empty audio');
      return blob;
    }

    function speakBrowserFallback(text) {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) { resolve(); return; }
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text).slice(0, 240));
          u.lang = 'zh-TW';
          u.rate = 1.05;
          u.onend = () => resolve();
          u.onerror = () => resolve();
          speechSynthesis.speak(u);
        } catch (_) { resolve(); }
      });
    }

    async function speak(text, opts) {
      if (!(opts && opts.force) && !ttsOnEl.checked) return;
      const chunks = splitSpeakChunks(text, 120);
      if (!chunks.length) return;
      const gen = ++ttsGen;
      stopTtsKeepGen();
      ttsBusy = true;
      setInterim('');
      setStatus('準備播報…', 'speak');
      setVoicePill('ok', '準備播報');
      updateMicIcon();
      let anyPlayed = false;
      try {
        // Prefetch first chunk immediately; keep one ahead
        let pending = fetchTtsBlob(chunks[0]).catch((e) => { console.warn(e); return null; });
        for (let i = 0; i < chunks.length; i++) {
          if (gen !== ttsGen) break;
          const blob = await pending;
          if (i + 1 < chunks.length) {
            pending = fetchTtsBlob(chunks[i + 1]).catch((e) => { console.warn(e); return null; });
          }
          if (!blob) continue;
          const ok = await playTtsBlob(blob, gen);
          if (ok) anyPlayed = true;
          else if (!anyPlayed) {
            await speakBrowserFallback(chunks[i]);
            anyPlayed = true;
          }
        }
      } catch (err) {
        console.warn('TTS failed', err);
        if (!anyPlayed) await speakBrowserFallback(prepareSpeakable(text).slice(0, 200));
      }
      if (gen === ttsGen) ttsBusy = false;
      if (gen !== ttsGen) return;
      updateMicIcon();
      if (!listening) {
        setStatus(tt('chat.online'));
        setVoicePill(SR() ? 'ok' : 'bad', SR() ? (continuousArmed ? '連續待命' : tt('chat.voiceReady')) : '語音不支援');
      }
      if (continuousArmed && inputMode === 'continuous' && !busy) {
        setTimeout(() => { if (continuousArmed && !busy && !listening) startListening({ fromContinuous: true }); }, 280);
      }
    }

    function fmtTime(ts) {
      if (!ts) return '';
      try {
        const d = new Date(ts.endsWith('Z') ? ts : ts + 'Z');
        if (Number.isNaN(d.getTime())) return ts;
        const now = Date.now();
        const diff = (now - d.getTime()) / 1000;
        if (diff < 60) return '剛剛';
        if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
        if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
        return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return ts; }
    }

    function snippet(text, n) {
      const s = String(text || '').replace(/\s+/g, ' ').trim();
      if (!s) return '';
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    function renderHistory(items) {
      histItems = items || [];
      if (!histItems.length) {
        histList.innerHTML = '<div class="hist-empty">' + tt('chatpage.noHistory') + '<br>送出第一則訊息後會出現在這裡</div>';
        return;
      }
      histList.innerHTML = histItems.map((it, idx) => `
        <button type="button" class="hist-item" data-idx="${idx}">
          <div class="hist-time">${escapeHtml(fmtTime(it.timestamp))}</div>
          <div class="hist-user">${escapeHtml(snippet(it.user || '(無文字)', 72))}</div>
          ${it.assistant ? `<div class="hist-assist">${escapeHtml(snippet(it.assistant, 70))}</div>` : ''}
        </button>
      `).join('');
      histList.querySelectorAll('.hist-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          histList.querySelectorAll('.hist-item').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          const it = histItems[Number(btn.dataset.idx)];
          if (!it) return;
          logEl.innerHTML = '';
          stickToBottom = true;
          if (it.user) appendMsg('user', it.user);
          if (it.assistant) appendMsg('bot', it.assistant);
          if (isMobileHist()) setHistoryOpen(false);
          inputEl.focus();
        });
      });
    }

    async function loadHistory(q) {
      histList.innerHTML = '<div class="hist-empty">' + tt('common.loading') + '</div>';
      try {
        const url = '/api/chat/history?limit=50' + (q ? '&q=' + encodeURIComponent(q) : '');
        const res = await fetch(url);
        const data = await res.json();
        renderHistory(data.items || []);
      } catch (err) {
        histList.innerHTML = '<div class="hist-empty">' + tt('chatpage.loadFail') + '</div>';
      }
    }

    async function seedRecentIntoLog() {
      try {
        const res = await fetch('/api/chat/history?limit=12');
        const data = await res.json();
        const items = (data.items || []).slice().reverse(); // API is newest-first; chat log needs oldest→newest
        if (!items.length) return;
        logEl.innerHTML = '';
        stickToBottom = true;
        items.forEach((it) => {
          if (it.user) appendMsg('user', it.user);
          if (it.assistant) appendMsg('bot', it.assistant);
        });
        scrollLogToBottom(true);
      } catch (_) {}
    }

    function autosizeInput() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    }

    function stripWake(text) {
      const wake = (wakeWordEl.value || '管家').trim();
      if (!wake) return text;
      const re = new RegExp('^' + wake.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[，,。.!！？\\s]*');
      return text.replace(re, '').trim();
    }

    async function sendChat(text, opts) {
      if (!text || busy) return;
      const cleaned = stripWake(String(text).trim());
      if (!cleaned) return;
      if (END_WORDS.test(cleaned.replace(/\s+/g, ''))) {
        continuousArmed = false;
        stopListening();
        syncModeUi();
        setStatus(tt('chat.online'));
        setVoicePill('ok', tt('chat.voiceReady'));
        return;
      }
      busy = true;
      sendBtn.disabled = true;
      micBtn.disabled = true;
      setStatus(tt('chatpage.processing'));
      stickToBottom = true;
      appendMsg('user', cleaned);
      const typing = appendTyping();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: cleaned }),
        });
        const data = await res.json().catch(() => ({}));
        typing.remove();
        if (!res.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));
        const reply = data.reply || '(空回覆)';
        appendMsg('bot', reply);
        setStatus(tt('chat.online'));
        loadHistory(document.getElementById('hist-q').value.trim());
        await speak(reply);
      } catch (err) {
        typing.remove();
        appendMsg('bot', tt('common.error') + '：' + String(err.message || err));
        setStatus(tt('chatpage.error'), 'error');
      } finally {
        busy = false;
        sendBtn.disabled = false;
        micBtn.disabled = false;
        updateMicIcon();
        if (!(opts && opts.keepFocusOff)) inputEl.focus();
        autosizeInput();
      }
    }

    function stopListening(opts) {
      listening = false;
      if (!(opts && opts.keepInterim)) setInterim('');
      try { if (rec) rec.stop(); } catch (_) {}
      rec = null;
      if (SR() && !busy) setVoicePill('ok', continuousArmed ? '連續待命' : tt('chat.voiceReady'));
      if (!busy && !(opts && opts.silent)) setStatus(tt('chat.online'));
      syncModeUi();
    }

    function queueCommit(text, delay) {
      clearTimeout(commitTimer);
      commitTimer = setTimeout(() => {
        const t = String(text || '').trim();
        if (!t || busy) return;
        sendChat(t, { keepFocusOff: true });
      }, delay);
    }

    function startListening(opts) {
      const Ctor = SR();
      if (!Ctor) {
        setStatus('此瀏覽器不支援語音辨識', 'error');
        setVoicePill('bad', '語音不支援');
        return;
      }
      if (busy) return;
      stopTts();
      clearTimeout(commitTimer);
      try { if (rec) rec.stop(); } catch (_) {}
      rec = new Ctor();
      rec.lang = 'zh-TW';
      rec.interimResults = true;
      rec.continuous = inputMode === 'continuous';
      listening = true;
      finalBuf = '';
      setStatus(inputMode === 'ptt' ? '按住聆聽中…' : '正在聽…', 'listen');
      setVoicePill('warn', inputMode === 'ptt' ? 'PTT 聆聽' : '正在聆聽');
      syncModeUi();

      rec.onresult = (ev) => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalBuf += t;
          else interim += t;
        }
        interimEl.textContent = (finalBuf || interim || '').trim();
        setInterim(interimEl.textContent);
        if (inputMode === 'ptt' && pttHolding) return;
        if (inputMode === 'tap' && finalBuf.trim()) {
          queueCommit(finalBuf.trim(), 220);
        } else if (inputMode === 'continuous' && finalBuf.trim()) {
          queueCommit(finalBuf.trim(), 380);
          finalBuf = '';
        }
      };
      rec.onerror = () => {
        if (inputMode === 'ptt' && pttHolding) return;
        stopListening({ silent: true });
      };
      rec.onend = () => {
        const text = (finalBuf || interimEl.textContent || '').trim();
        const wasPtt = inputMode === 'ptt';
        listening = false;
        updateMicIcon();
        if (wasPtt && !pttHolding && text) {
          sendChat(text, { keepFocusOff: true });
          setInterim('');
          return;
        }
        if (inputMode === 'continuous' && continuousArmed && !busy) {
          setTimeout(() => {
            if (continuousArmed && !busy && !listening) startListening({ fromContinuous: true });
          }, 280);
          return;
        }
        if (!continuousArmed) {
          setVoicePill('ok', tt('chat.voiceReady'));
          if (!busy) setStatus(tt('chat.online'));
        }
        syncModeUi();
      };
      try { rec.start(); } catch (_) { stopListening(); }
    }

    function hardResetVoice() {
      continuousArmed = false;
      pttHolding = false;
      clearTimeout(commitTimer);
      stopTts();
      stopListening();
      setVoicePill(SR() ? 'ok' : 'bad', SR() ? tt('chat.voiceReady') : '語音不支援');
      setStatus('語音已重置');
      syncModeUi();
    }

    function onTalkClick() {
      // Stop icon / any active voice session → stop (not only Esc)
      if (ttsBusy || listening || continuousArmed || (audio && !audio.paused)) {
        stopAllVoice();
        return;
      }
      if (inputMode === 'ptt') return;
      if (inputMode === 'continuous') {
        continuousArmed = true;
        startListening();
        return;
      }
      startListening();
    }

    function pttDown(e) {
      if (inputMode !== 'ptt') return;
      if (e && e.preventDefault) e.preventDefault();
      if (ttsBusy) {
        stopAllVoice();
        return;
      }
      if (busy || pttHolding) return;
      pttHolding = true;
      finalBuf = '';
      startListening();
    }
    function pttUp(e) {
      if (inputMode !== 'ptt') return;
      if (e && e.preventDefault) e.preventDefault();
      if (!pttHolding) return;
      pttHolding = false;
      const text = (finalBuf || interimEl.textContent || '').trim();
      try { if (rec) rec.stop(); } catch (_) {}
      stopListening({ keepInterim: true, silent: true });
      if (text) sendChat(text, { keepFocusOff: true });
      setInterim('');
    }

    function setHistoryOpen(open) {
      historyEl.classList.toggle('collapsed', !open);
      histBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      histBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
      histBackdrop.classList.toggle('show', open && isMobileHist());
      try { localStorage.setItem('aura_chat_hist_open', open ? '1' : '0'); } catch (_) {}
    }
    function toggleHistory() {
      setHistoryOpen(historyEl.classList.contains('collapsed'));
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = (inputEl.value || '').trim();
      if (!text) return;
      inputEl.value = '';
      autosizeInput();
      sendChat(text);
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('form').requestSubmit();
      }
    });
    inputEl.addEventListener('input', autosizeInput);

    document.querySelectorAll('.mode-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        inputMode = btn.dataset.mode;
        continuousArmed = false;
        pttHolding = false;
        stopListening({ silent: true });
        syncModeUi();
      });
    });
    micBtn.addEventListener('click', (e) => {
      // Always allow click-to-stop while speaking/listening (including PTT mode)
      if (ttsBusy || listening || continuousArmed || (audio && !audio.paused)) {
        e.preventDefault();
        e.stopPropagation();
        stopAllVoice();
        return;
      }
      if (inputMode === 'ptt') return;
      onTalkClick();
    });
    ['pointerdown'].forEach((ev) => {
      micBtn.addEventListener(ev, (e) => {
        if (ttsBusy || listening || continuousArmed) {
          // Let click handler stop; don't start PTT hold
          if (inputMode === 'ptt') {
            e.preventDefault();
            stopAllVoice();
          }
          return;
        }
        if (inputMode === 'ptt') pttDown(e);
      });
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
      micBtn.addEventListener(ev, (e) => {
        if (inputMode === 'ptt' && !ttsBusy) pttUp(e);
      });
    });

    function stopAllVoice() {
      continuousArmed = false;
      pttHolding = false;
      ttsBusy = false;
      clearTimeout(commitTimer);
      stopTts();
      stopListening();
      setStatus(tt('chat.online'));
      setVoicePill(SR() ? 'ok' : 'bad', SR() ? tt('chat.voiceReady') : '語音不支援');
      updateMicIcon();
      syncModeUi();
    }
    voiceReady.addEventListener('click', () => {
      if (ttsBusy || listening || continuousArmed || (audio && !audio.paused)) stopAllVoice();
    });
    document.getElementById('btn-voice-more').addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !voiceMore.classList.contains('show');
      voiceMore.classList.toggle('show', open);
      document.getElementById('btn-voice-more').setAttribute('aria-expanded', open ? 'true' : 'false');
      document.getElementById('top-menu-panel').classList.remove('show');
    });
    const topMoreBtn = document.getElementById('btn-top-more');
    const topMenuPanel = document.getElementById('top-menu-panel');
    topMoreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !topMenuPanel.classList.contains('show');
      topMenuPanel.classList.toggle('show', open);
      topMoreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      voiceMore.classList.remove('show');
      document.getElementById('btn-voice-more').setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', (e) => {
      if (!voiceMore.contains(e.target) && e.target !== document.getElementById('btn-voice-more') && !document.getElementById('btn-voice-more').contains(e.target)) {
        voiceMore.classList.remove('show');
        document.getElementById('btn-voice-more').setAttribute('aria-expanded', 'false');
      }
      if (!topMenuPanel.contains(e.target) && e.target !== topMoreBtn && !topMoreBtn.contains(e.target)) {
        topMenuPanel.classList.remove('show');
        topMoreBtn.setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('btn-voice-reset').addEventListener('click', hardResetVoice);
    document.getElementById('btn-preview-tts').addEventListener('click', () => {
      speak('你好，我是 Aura。這是目前選擇的自然語音聲線。', { force: true });
    });
    ttsVoiceEl.addEventListener('change', () => {
      try { localStorage.setItem('aura_tts_voice', ttsVoiceEl.value); } catch (_) {}
    });
    ttsQualityEl.addEventListener('change', () => {
      try { localStorage.setItem('aura_tts_rate', ttsQualityEl.value); } catch (_) {}
    });
    ttsPlayRateEl.addEventListener('change', () => {
      try { localStorage.setItem('aura_tts_play', ttsPlayRateEl.value); } catch (_) {}
    });
    wakeWordEl.addEventListener('change', () => {
      try { localStorage.setItem('aura_wake_word', wakeWordEl.value.trim() || '管家'); } catch (_) {}
    });

    function showEmptyState(msg) {
      logEl.innerHTML = `
        <div class="empty" id="empty">
          <h3>${msg || tt('chatpage.empty')}</h3>
          <p data-i18n="chat.greeting">${tt('chat.greeting')}</p>
          <div class="empty-actions">
            <button type="button" class="chip" data-prompt="今天家裡有什麼狀況？">家裡狀況</button>
            <button type="button" class="chip" data-prompt="幫我查一下最近的對話重點">對話重點</button>
            <button type="button" class="chip" data-prompt="用輕鬆一點的語氣跟我聊天">輕鬆聊聊</button>
          </div>
        </div>`;
      bindChips();
    }
    function bindChips() {
      logEl.querySelectorAll('.chip[data-prompt]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const p = chip.getAttribute('data-prompt');
          if (p) sendChat(p);
        });
      });
    }
    document.getElementById('btn-clear').addEventListener('click', () => showEmptyState(tt('chatpage.clear')));
    document.getElementById('btn-new').addEventListener('click', () => {
      showEmptyState(tt('chatpage.new'));
      if (isMobileHist()) setHistoryOpen(false);
      inputEl.focus();
    });
    document.getElementById('btn-reset').addEventListener('click', async () => {
      try {
        await fetch('/api/chat/reset', { method: 'POST' });
        setStatus('Session 已重設');
        appendMsg('bot', '已重設短期對話 Session。長期記憶與歷史日誌仍保留。');
      } catch (err) {
        appendMsg('bot', '重設失敗：' + String(err.message || err));
      }
    });
    histBtn.addEventListener('click', toggleHistory);
    histBackdrop.addEventListener('click', () => setHistoryOpen(false));
    document.getElementById('btn-hist-refresh').addEventListener('click', () => {
      loadHistory(document.getElementById('hist-q').value.trim());
    });
    let qTimer = null;
    document.getElementById('hist-q').addEventListener('input', (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => loadHistory(e.target.value.trim()), 280);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        stopAllVoice();
        if (isMobileHist() && !historyEl.classList.contains('collapsed')) setHistoryOpen(false);
      }
      if (e.code === 'Space' && inputMode === 'ptt' && document.activeElement !== inputEl && document.activeElement !== wakeWordEl) {
        if (!e.repeat) pttDown(e);
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && inputMode === 'ptt' && document.activeElement !== inputEl) {
        pttUp(e);
        e.preventDefault();
      }
    });
    window.addEventListener('resize', () => {
      const open = !historyEl.classList.contains('collapsed');
      histBackdrop.classList.toggle('show', open && isMobileHist());
    });

    async function loadVoicePrefs() {
      const fallback = [
        { id: 'zh-TW-HsiaoYuNeural', label: '曉雨（柔和女聲）' },
        { id: 'zh-TW-HsiaoChenNeural', label: '曉臻（清晰女聲）' },
        { id: 'zh-TW-YunJheNeural', label: '雲哲（沉穩男聲）' },
      ];
      let voices = fallback;
      let defVoice = 'zh-TW-HsiaoYuNeural';
      let defRate = '+0%';
      try {
        const res = await fetch('/api/tts/voices');
        const data = await res.json();
        if (data.voices && data.voices.length) voices = data.voices;
        if (data.default_voice) defVoice = data.default_voice;
        if (data.default_rate) defRate = data.default_rate;
      } catch (_) {}
      ttsVoiceEl.innerHTML = voices.map((v) => `<option value="${escapeHtml(v.id)}">${escapeHtml(v.label || v.id)}</option>`).join('');
      try {
        ttsVoiceEl.value = localStorage.getItem('aura_tts_voice') || defVoice;
        ttsQualityEl.value = localStorage.getItem('aura_tts_rate') || defRate;
        ttsPlayRateEl.value = localStorage.getItem('aura_tts_play') || '1';
        wakeWordEl.value = localStorage.getItem('aura_wake_word') || '管家';
      } catch (_) {
        ttsVoiceEl.value = defVoice;
        ttsQualityEl.value = defRate;
      }
    }

    if (!SR()) {
      setVoicePill('bad', '請用 Chrome / Edge');
      micBtn.disabled = true;
    } else {
      setVoicePill('ok', tt('chat.voiceReady'));
    }

    try {
      const saved = localStorage.getItem('aura_chat_hist_open');
      if (saved === '0' || (saved == null && isMobileHist())) setHistoryOpen(false);
      else setHistoryOpen(true);
    } catch (_) {
      setHistoryOpen(!isMobileHist());
    }

    initI18n();
    bindChips();
    syncModeUi();
    loadVoicePrefs();
    loadHistory('');
    seedRecentIntoLog();
    autosizeInput();
    inputEl.focus();
  </script>
</body>
</html>
